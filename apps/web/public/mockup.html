<title>TipItaly B2C — Mockup v3</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  background: #e8e8ec;
  min-height: 100vh;
  color: #111;
}

/* ── Shell header ── */
.shell-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 32px 12px;
  background: #1a1a1a;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.shell-logo { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: #EA580C; }
.shell-logo span { font-size: 12px; font-weight: 500; color: #666; margin-left: 8px; font-family: 'Plus Jakarta Sans', sans-serif; }
.shell-badge { background: rgba(234,88,12,0.18); border: 1px solid rgba(234,88,12,0.35); color: #EA580C; font-size: 11px; font-weight: 600; padding: 4px 14px; border-radius: 20px; }

/* ── Nav pills ── */
.nav-row { display: flex; gap: 7px; padding: 14px 32px 0; flex-wrap: wrap; background: #1a1a1a; }
.pill {
  padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04); color: #999; transition: all 0.2s;
}
.pill:hover { color: #ddd; background: rgba(255,255,255,0.07); }
.pill.active { background: rgba(234,88,12,0.2); border-color: rgba(234,88,12,0.45); color: #EA580C; }

/* ── Layout ── */
.all-view { display: flex; flex-wrap: wrap; gap: 24px; padding: 28px 32px 60px; justify-content: center; }
.all-view.hidden { display: none; }
.single-view { display: none; justify-content: center; padding: 28px 32px 60px; }
.single-view.active { display: flex; }

/* ── Phone frame ── */
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.phone-wrap.clickable { cursor: pointer; }
.phone-wrap.clickable:hover .phone-frame { border-color: rgba(234,88,12,0.5); transform: translateY(-3px); }
.phone-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #888; }
.phone-frame {
  width: 320px; height: 660px;
  border-radius: 44px; border: 2px solid rgba(255,255,255,0.15);
  background: #f5f5f7; overflow: hidden; position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: border-color 0.2s, transform 0.2s;
}
.phone-frame.mini { width: 175px; height: 360px; border-radius: 28px; }

/* ── Screen ── */
.screen {
  width: 100%; height: 100%;
  overflow-y: auto; overflow-x: hidden;
  background: #f5f5f7; color: #111;
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  font-size: 13px; scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.mini-scale { transform: scale(0.547); transform-origin: top left; width: 585px; height: 1205px; }

/* ── Material icons ── */
.ms { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20; font-size: 20px; line-height: 1; display: inline-block; }
.ms.fill { font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 20; }

/* ── Orange header (status + nav bar) ── */
.orange-status {
  background: #EA580C; display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px 6px; font-size: 12px; font-weight: 600; color: #fff;
}
.orange-nav {
  background: #EA580C; display: flex; align-items: center; justify-content: space-between;
  padding: 6px 16px 12px;
}
.orange-nav .title { font-size: 15px; font-weight: 600; color: #fff; }
.white-nav {
  background: #fff; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px 10px; border-bottom: 0.5px solid #e5e5e5;
}
.white-nav .title { font-size: 16px; font-weight: 600; color: #111; }

/* ── Content area ── */
.content { background: #f5f5f7; padding: 14px; }
.card-white {
  background: #fff; border-radius: 14px; border: 0.5px solid #e5e5e5;
  padding: 14px; margin-bottom: 10px;
}

/* ── Bottom nav ── */
.bnav {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; background: #fff; border-top: 0.5px solid #e5e5e5;
  padding: 6px 0 12px;
}
.bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9px; color: #aaa; }
.bnav-item.active { color: #EA580C; }
.bnav-item .ms { font-size: 22px; }

/* ── Physical card ── */
.tipcard {
  width: 100%; aspect-ratio: 1.586;
  border-radius: 14px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 14px 16px;
}
.tipcard.navy { background: linear-gradient(135deg, #0b1d3a 0%, #142d58 50%, #0d2040 100%); }
.tipcard.gold { background: linear-gradient(135deg, #b8860b 0%, #daa520 40%, #f5c842 60%, #c8941a 100%); }
.tipcard.platinum { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 50%, #1a1a2e 100%); }
.tipcard-wave {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0.1;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,0.3) 0px, transparent 2px, transparent 12px, rgba(255,255,255,0.15) 14px);
}
.tipcard-label {
  font-family: 'Outfit', serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.2em; text-align: right;
}
.tipcard-logo { font-family: 'Outfit', serif; font-size: 26px; font-weight: 700; }
.tipcard-num { font-size: 12px; letter-spacing: 0.15em; opacity: 0.85; }
.tipcard-bottom { display: flex; align-items: center; justify-content: space-between; }
.tipcard-exp { font-size: 11px; opacity: 0.75; }
.tipcard-active {
  background: #16a34a; color: #fff; font-size: 9px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; letter-spacing: 0.08em;
}

/* ── Benefit row ── */
.benefit-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 0.5px solid #f0f0f0;
}
.benefit-row:last-child { border-bottom: none; }
.benefit-icon {
  width: 34px; height: 34px; border-radius: 9px;
  background: rgba(234,88,12,0.08); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.benefit-icon .ms { font-size: 18px; color: #EA580C; }
.benefit-title { font-size: 12px; font-weight: 600; color: #111; }
.benefit-sub { font-size: 10px; color: #888; margin-top: 1px; }

/* ── Plan card ── */
.plan-row {
  display: flex; align-items: flex-start; gap: 12px;
  background: #fff; border: 1px solid #e5e5e5; border-radius: 14px;
  padding: 14px; margin-bottom: 10px;
}
.plan-row.selected { border-color: #EA580C; border-width: 2px; }
.plan-mini-card {
  width: 62px; height: 39px; border-radius: 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative;
}
.plan-mini-label { font-size: 7px; font-weight: 700; letter-spacing: 0.12em; position: absolute; bottom: 5px; right: 6px; }

/* ── Chat ── */
.bubble { max-width: 82%; padding: 9px 12px; border-radius: 16px; font-size: 11px; line-height: 1.5; margin-bottom: 8px; }
.bubble.sofia { background: #f0f0f7; border: 1px solid #e8e8f0; color: #222; align-self: flex-start; border-bottom-left-radius: 3px; }
.bubble.user { background: #EA580C; color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
.chip-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.chip { background: rgba(234,88,12,0.1); border: 1px solid rgba(234,88,12,0.25); color: #EA580C; font-size: 9px; padding: 3px 9px; border-radius: 10px; font-weight: 600; }

/* ── Advantage grid ── */
.adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.adv-item {
  background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px;
  display: flex; align-items: center; gap: 8px;
  padding: 12px 10px;
}
.adv-icon { width: 34px; height: 34px; border-radius: 8px; background: rgba(234,88,12,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.adv-label { font-size: 11px; font-weight: 600; color: #111; flex: 1; }
.adv-arrow { color: #EA580C; font-size: 14px; }

/* ── Partner logos ── */
.partner-logo {
  flex: 1; height: 44px; background: #fff; border: 0.5px solid #e5e5e5;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; overflow: hidden;
}

/* ── Forms ── */
.form-input {
  width: 100%; border: 1px solid #ddd; border-radius: 10px;
  padding: 10px 12px; font-size: 12px; color: #444;
  background: #fff; margin-bottom: 8px; font-family: inherit;
}
.form-lbl { font-size: 9px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.orange-btn {
  background: #EA580C; color: #fff; border: none; border-radius: 14px;
  padding: 15px; width: 100%; font-size: 14px; font-weight: 700; text-align: center;
}
</style>
</head>

<script>
const SCREENS = [
  { id: 'home',       label: '🏠 Home' },
  { id: 'card-scelta',label: '💳 Scegli Card' },
  { id: 'card-gold',  label: '🥇 Card GOLD' },
  { id: 'carrello',   label: '🛒 Carrello' },
  { id: 'checkout',   label: '🔒 Checkout' },
  { id: 'tipa',       label: '✨ TIPA Chat' },
  { id: 'esplora',    label: '🔍 Esplora' },
  { id: 'profilo',    label: '👤 Profilo' },
];

function getContent(id) {
  const tpl = document.getElementById('tpl-' + id);
  return tpl ? tpl.innerHTML : '';
}

function buildAll() {
  const container = document.getElementById('all-view');
  container.innerHTML = '';
  SCREENS.forEach(s => {
    const wrap = document.createElement('div');
    wrap.className = 'phone-wrap clickable';
    wrap.onclick = () => showOne(s.id);

    const label = document.createElement('div');
    label.className = 'phone-label';
    label.textContent = s.label;

    const frame = document.createElement('div');
    frame.className = 'phone-frame mini';

    const inner = document.createElement('div');
    inner.className = 'screen mini-scale';
    inner.innerHTML = getContent(s.id);
    frame.appendChild(inner);

    wrap.appendChild(label);
    wrap.appendChild(frame);
    container.appendChild(wrap);
  });
}

function showAll() {
  document.getElementById('all-view').classList.remove('hidden');
  document.getElementById('single-view').classList.remove('active');
  document.querySelectorAll('.pill').forEach((p, i) => p.classList.toggle('active', i === 0));
}

function showOne(id) {
  document.getElementById('all-view').classList.add('hidden');
  const sv = document.getElementById('single-view');
  sv.classList.add('active');
  const s = SCREENS.find(x => x.id === id);
  document.getElementById('single-label').textContent = s ? s.label : '';
  document.getElementById('single-frame').innerHTML = getContent(id);
  document.querySelectorAll('.pill').forEach((p, i) => {
    p.classList.toggle('active', i > 0 && SCREENS[i - 1].id === id);
  });
}

buildAll();
</script>
